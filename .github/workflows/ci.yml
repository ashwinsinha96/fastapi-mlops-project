name: FastAPI ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4        

      - name: Set up Python
        uses: actions/setup-python@v5   
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn scikit-learn joblib numpy pytest httpx

      - name: Run Training Script
        run: python train.py

      - name: Run Tests
        run: pytest test_main.py -v